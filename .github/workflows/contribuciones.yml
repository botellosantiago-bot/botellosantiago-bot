name: Actualizar mapa de contribuciones
on:
  schedule:
    - cron: "17 12 * * *"   # 6:17 am en CDMX
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mapa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/contribuciones.py ${{ github.repository_owner }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mapa de contribuciones del día"
          file_pattern: assets/contribuciones.svg
